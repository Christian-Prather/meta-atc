# GRUB A/B slot selection for atc, with RAUC as the writer.
#
# This is the bootloader tier. It is the only code that can count a failed boot,
# because a kernel that panics, an image with no init, and a broken initramfs
# all fail before userspace starts. This file fails CLOSED.
#
# THE VARIABLES. RAUC's GRUB backend writes three kinds with grub-editenv:
#
#   ORDER            "A B" | "B A"   the slots in boot order; an install puts
#                                    its target first
#   <slot>_OK        0 | 1           RAUC's mark: 1 good or active, 0 bad
#   <slot>_TRY       0 | 1           RAUC writes 0 on every mark; this file
#                                    writes 1 when a trial starts
#
# RAUC's variables cannot tell "armed" from "confirmed": both read OK=1 TRY=0.
# So this file adds two variables that only it writes, and RAUC keeps them.
# "No trial" is the word `none`, not an empty value. A missing variable must
# fail validation, and an empty value reads the same as a missing one.
#
#   ATC_STEADY       A | B           the last confirmed slot
#   ATC_TRIAL        none | A | B    the slot on trial
#
# THE DECISION, on every boot. First, a trial that RAUC marked good (its OK=1
# and TRY=0) becomes ATC_STEADY, and the trial clears (confirmed). This runs
# before the head is chosen, and not only when the trial is the head. An
# install into the other slot after the mark, and before a reboot, then
# starts a trial of that slot. It does not boot it as a steady slot.
#
# Then "head" is the first slot in ORDER with OK=1:
#
#   no head                          boot ATC_STEADY, clear the trial (both bad)
#   head = ATC_STEADY                boot head, clear ATC_TRIAL (steady)
#   head = ATC_TRIAL                 head OK = 0, ORDER = steady first, clear
#                                    the trial, boot ATC_STEADY (spent)
#   otherwise                        ATC_TRIAL = head, head TRY = 1, boot head
#                                    (new trial)
#
# A confirmed slot never reverts on a boot that misses a mark, because only a
# trial counts. That is the reason for the two extra variables. RAUC's example
# config spends a try on every boot instead.
#
# scripts/check-atc-ab-layout.sh asserts the shape of this file. The live proof is the only test that runs it.
#
# FAIL CLOSED MEANS THE DEFAULTS BELOW. They are set before the environment is
# read. A missing environment file, an unreadable one, and a value outside its
# domain all leave these standing: boot slot A, no trial in flight.

function atc_set_defaults {
    set ORDER="A B"
    set A_OK=1
    set A_TRY=0
    set B_OK=0
    set B_TRY=0
    set ATC_STEADY=A
    set ATC_TRIAL=none
}

atc_set_defaults

# ── The console ──────────────────────────────────────────────────────────────
#
# EFI and BIOS need OPPOSITE things here, so the platform decides.
#
# On EFI, firmware owns the console. OVMF with no display maps its EFI console
# onto the serial line, so GRUB's default `console` terminal already reaches the
# port. Adding `serial --unit=0` there drives a legacy UART under firmware that
# already drives it, and `terminal_output serial` then selects a terminal that
# carries nothing. Measured: with that form, no GRUB output reached ttyS0.
#
# On BIOS there is no firmware console to inherit, so the legacy UART is opened
# by hand. This layer builds EFI images only. The branch stops a BIOS target from
# silently inheriting the EFI answer.
if [ "$grub_platform" = "efi" ]; then
    terminal_input console
    terminal_output console
else
    serial --unit=0 --speed=115200
    terminal_input serial console
    terminal_output serial console
fi

# The labels and the partition numbers. atc-ab.wks.in writes both, and
# scripts/check-atc-ab-layout.sh fails when the files disagree.
set atc_esp_label=atcesp
set atc_slot_a_label=atcroota
set atc_slot_b_label=atcrootb
set atc_slot_a_part=gpt2
set atc_slot_b_part=gpt3

# The one environment file. RAUC's `grubenv=` in system.conf names the same file
# through the /boot mount of the ESP.
set atc_env=/atc/grubenv

search --no-floppy --label $atc_esp_label --set=atc_esp

# The disk that holds the ESP holds both slots.
#
# A slot is found by its PARTITION NUMBER on that disk, not by a filesystem
# label. RAUC writes a slot with the bundle's ext4 image, and that filesystem
# has no label: one image must boot in either slot, so it cannot name one. A
# `search --label atcrootb` therefore finds nothing after the first install.
# GRUB 2.12 cannot search by GPT partition name. The kernel can, so the kernel
# command line keeps `root=PARTLABEL=`.
regexp --set=1:atc_disk '^(.*),gpt[0-9]+$' "$atc_esp"

# ── Reading the environment ──────────────────────────────────────────────────
#
# Clear every variable to a value NO domain accepts, then read.
#
# `load_env` assigns only the names the block carries, and it leaves every other
# variable standing. Without the clear, a partial block inherits the defaults.
# For example, a block that holds only `ORDER=B A` and `B_OK=1` would start a
# trial of B on an environment that never said A was confirmed. `invalid` is
# outside every domain, so a variable that the block does not supply always
# fails validation.
function atc_clear_env {
    set ORDER=invalid
    set A_OK=invalid
    set A_TRY=invalid
    set B_OK=invalid
    set B_TRY=invalid
    set ATC_STEADY=invalid
    set ATC_TRIAL=invalid
}

# Every variable inside its domain. A value outside it means a corrupt block or
# a writer this config does not know about, and both are refusals.
function atc_env_valid {
    if [ "$ORDER" != "A B" -a "$ORDER" != "B A" ]; then
        return 1
    fi
    if [ "$A_OK" != "0" -a "$A_OK" != "1" ]; then
        return 1
    fi
    if [ "$A_TRY" != "0" -a "$A_TRY" != "1" ]; then
        return 1
    fi
    if [ "$B_OK" != "0" -a "$B_OK" != "1" ]; then
        return 1
    fi
    if [ "$B_TRY" != "0" -a "$B_TRY" != "1" ]; then
        return 1
    fi
    if [ "$ATC_STEADY" != "A" -a "$ATC_STEADY" != "B" ]; then
        return 1
    fi
    if [ "$ATC_TRIAL" != "none" -a "$ATC_TRIAL" != "A" -a "$ATC_TRIAL" != "B" ]; then
        return 1
    fi
    return 0
}

function atc_load_env {
    atc_clear_env
    load_env --file ($atc_esp)$atc_env ORDER A_OK A_TRY B_OK B_TRY ATC_STEADY ATC_TRIAL
    if atc_env_valid; then
        return 0
    fi

    # Restore the fail-closed defaults. A half-read environment leaves whichever
    # variables `load_env` did assign, and booting on that mix is the state this
    # function exists to refuse.
    echo "atc: boot environment unreadable, falling back to slot A"
    atc_set_defaults
    return 1
}

# Write the variables this config owns, plus the ones a trial or a revert
# changes. The status is load-bearing: `save_env` fails on a read-only ESP, on a
# full one, and on a file GRUB can read but not write. The callers act on it.
#
# `if ! cmd; then`, and NOT `cmd || fallback`. GRUB script has no `||`
# operator, and a config that does not parse leaves the guest at a prompt.
function atc_save_env {
    if ! save_env --file ($atc_esp)$atc_env ORDER A_OK A_TRY B_OK B_TRY ATC_STEADY ATC_TRIAL; then
        return 1
    fi
    return 0
}

# ── The slot decision ────────────────────────────────────────────────────────

atc_load_env

# Confirmed. RAUC's mark-good writes OK=1 TRY=0 on the trial slot.
set atc_confirmed=0
if [ "$ATC_TRIAL" = "A" -a "$A_OK" = "1" -a "$A_TRY" = "0" ]; then
    set atc_confirmed=1
fi
if [ "$ATC_TRIAL" = "B" -a "$B_OK" = "1" -a "$B_TRY" = "0" ]; then
    set atc_confirmed=1
fi
if [ "$atc_confirmed" = "1" ]; then
    echo "atc: slot $ATC_TRIAL confirmed"
    set ATC_STEADY=$ATC_TRIAL
    set ATC_TRIAL=none
    if ! atc_save_env; then
        # The slot is good in RAUC's record. The next boot reads the same
        # variables and tries the save again.
        echo "atc: WARNING could not record the confirmed slot"
    fi
fi

# The head: the first slot in ORDER whose OK is 1. GRUB script has no indirect
# expansion, so each slot is spelled out.
set atc_head=
for atc_slot in $ORDER; do
    if [ -z "$atc_head" ]; then
        if [ "$atc_slot" = "A" -a "$A_OK" = "1" ]; then
            set atc_head=A
        fi
        if [ "$atc_slot" = "B" -a "$B_OK" = "1" ]; then
            set atc_head=B
        fi
    fi
done

# The slot this boot loads. Every branch below sets it.
set atc_boot=$ATC_STEADY

if [ -z "$atc_head" ]; then
    # Both bad. Boot the last confirmed slot and record nothing. If it cannot
    # load either, the reboot below makes this a visible boot loop.
    echo "atc: no slot is marked good, booting the last confirmed slot $ATC_STEADY"
    # End a trial that is still recorded. Left set, a later install into that
    # slot would read to the confirm step above as a mark-good, and the slot
    # would boot with no trial.
    if [ "$ATC_TRIAL" != "none" ]; then
        set ATC_TRIAL=none
        if ! atc_save_env; then
            echo "atc: WARNING could not clear the ended trial"
        fi
    fi
elif [ "$atc_head" = "$ATC_STEADY" ]; then
    # Steady. A trial that a mark-bad ended leaves ATC_TRIAL set; clear it.
    set atc_boot=$atc_head
    if [ "$ATC_TRIAL" != "none" ]; then
        set ATC_TRIAL=none
        if ! atc_save_env; then
            echo "atc: WARNING could not clear the ended trial"
        fi
    fi
elif [ "$atc_head" = "$ATC_TRIAL" ]; then
    # Spent. The trial had its one boot and nothing marked it good: a marked
    # trial was confirmed above, so its TRY is 1 here.
    #
    # The revert is recorded BEFORE the boot. A crash during the reverted boot
    # must leave a state that reverts again, never one that retries the slot
    # that already failed.
    echo "atc: trial boot of slot $atc_head did not confirm, reverting to $ATC_STEADY"
    if [ "$atc_head" = "A" ]; then
        set A_OK=0
    else
        set B_OK=0
    fi
    set ORDER="$ATC_STEADY $atc_head"
    set ATC_TRIAL=none
    set atc_boot=$ATC_STEADY
    if ! atc_save_env; then
        # The revert still boots: the slot chosen here is the one that ran
        # before the trial. The stored state is unchanged, so the next boot
        # reverts again and reaches the same slot.
        echo "atc: WARNING could not write the boot environment"
    fi
else
    # A new trial. RAUC made this slot the head with OK=1 TRY=0 at the end of
    # an install, and it is neither the confirmed slot nor a trial in flight.
    #
    # Record before boot: TRY=1 reaches the disk before `linux` runs, so a slot
    # that never reaches userspace still spends its one trial.
    set ATC_TRIAL=$atc_head
    if [ "$atc_head" = "A" ]; then
        set A_TRY=1
    else
        set B_TRY=1
    fi
    if ! atc_save_env; then
        # The count did not persist, so this trial would be the first one again
        # on every boot. Refuse to start it and boot the confirmed slot.
        echo "atc: WARNING could not record the trial boot of $atc_head, staying on $ATC_STEADY"
        set atc_boot=$ATC_STEADY
    else
        echo "atc: trial boot of slot $atc_head"
        set atc_boot=$atc_head
    fi
fi

if [ "$atc_boot" = "B" ]; then
    set atc_root_label=$atc_slot_b_label
    set atc_root_part=$atc_slot_b_part
else
    set atc_root_label=$atc_slot_a_label
    set atc_root_part=$atc_slot_a_part
fi

# ── The boot ─────────────────────────────────────────────────────────────────
#
# The kernel comes from the SELECTED SLOT, not from the ESP. A shared kernel
# would make a kernel upgrade un-rollbackable while the rootfs beside it rolled
# back.
#
# `root=PARTLABEL=` and not a PARTUUID: wic assigns partition UUIDs at build
# time. The label is written by atc-ab.wks.in and is stable across builds.
#
# `rauc.slot=` names the booted slot by its bootname. RAUC reads it as the
# booted slot, and only this file writes it, so the proof checks it. `panic=5`
# reboots a kernel that panics, and the next boot finds the trial spent.
#
# ttyS0 LAST. The kernel makes the last `console=` the one /dev/console points
# at, and the getty generator keys off it. With tty0 last, a headless boot goes
# silent after early boot and offers no serial login.

if [ -n "$atc_disk" ]; then
    set root=($atc_disk,$atc_root_part)
else
    # No ESP was found, so the environment was not read either and the
    # defaults chose slot A. The factory filesystem of slot A carries its label.
    search --no-floppy --label $atc_root_label --set=root
fi

set atc_console="console=tty0 console=ttyS0,115200"

# A slot that cannot load reboots. Without this, an empty rootfs stops at a GRUB
# prompt and nothing reverts. The next boot finds the trial spent.
if ! linux /boot/bzImage root=PARTLABEL=$atc_root_label rw $atc_console rauc.slot=$atc_boot panic=5; then
    echo "atc: could not load the kernel of slot $atc_boot, rebooting"
    reboot
fi
boot
echo "atc: could not boot slot $atc_boot, rebooting"
reboot
