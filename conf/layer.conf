# meta-atc layer configuration.
#
# Add this layer to a build with:
#   bitbake-layers add-layer /path/to/meta-atc

BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "atc"
BBFILE_PATTERN_atc = "^${LAYERDIR}/"
BBFILE_PRIORITY_atc = "10"

# Name the series explicitly. "The current LTS" is not a pin: a build against a
# different series must fail here, not later in a recipe.
LAYERSERIES_COMPAT_atc = "scarthgap"

# meta-rauc, at the commit conf/layers.pin names. meta-rauc-community stays out:
# its qemu layer carries example keys and a GRUB recipe that conflicts with
# recipes-bsp/atc-grub-env.
LAYERDEPENDS_atc = "core rauc"

# OE4T meta-tegra, for the Jetson Orin machines. RECOMMENDS and not DEPENDS: a
# qemu build does not add it, and checkout-layers.sh checks it out only for
# `--for tegra234`. Every Tegra choice in this layer is keyed on the tegra234
# override, which only a meta-tegra machine sets, so without the layer those
# lines do nothing.
LAYERRECOMMENDS_atc = "tegra"

# A bbappend for a meta-tegra recipe lives under dynamic-layers/tegra/, and
# bitbake adds it only when the `tegra` collection is in the build. A plain
# BBFILES entry would leave an append with no recipe in a qemu build, which
# fails the parse.
BBFILES_DYNAMIC += "tegra:${LAYERDIR}/dynamic-layers/tegra/recipes-*/*/*.bbappend"

# Machine-wide BSP configuration for the Jetson machines. It lives here because
# meta-atc has no distro conf, and layer.conf is the one file of this layer
# that every recipe of the build reads. An image recipe is the wrong place: the
# UEFI firmware (edk2-firmware-tegra) and the capsule (tegra-uefi-capsules) read
# these values too. Set only in the image, the image would be redundant, while
# the capsule wrote a bootloader without RootfsRedundancyLevel=AB and without
# the retry count below.
#
# The redundant layout: two rootfs partitions, APP and APP_b, each paired with
# one QSPI bootloader chain. Every line is a `:tegra234` override, so a qemu
# build gets nothing from it.
#
# ATC_TEGRA_REDUNDANT is the only opt-out. An override-qualified value wins
# over the plain variable whatever their order and strength, so a plain
# `USE_REDUNDANT_FLASH_LAYOUT_DEFAULT = "0"` in a build configuration loses to
# the line below and changes nothing. `ATC_TEGRA_REDUNDANT = "0"` builds
# meta-tegra's single-APP layout: atc-image builds, and atc-image-ab and
# atc-bundle are skipped with the reason, because the nvbootctrl backend needs
# APP_b.
ATC_TEGRA_REDUNDANT ??= "1"
USE_REDUNDANT_FLASH_LAYOUT_DEFAULT:tegra234 = "${ATC_TEGRA_REDUNDANT}"
# One boot per rootfs trial (recipes-bsp/atc-tegra-bootcontrol). It is appended
# after meta-tegra's overlays, so its RootfsRetryCountMax replaces the default.
TEGRA_BOOTCONTROL_OVERLAYS:append:tegra234 = "${@' L4TConfiguration-AtcRootfsRetryCountMax.dtbo' if bb.utils.to_boolean(d.getVar('USE_REDUNDANT_FLASH_LAYOUT')) else ''}"
