# atcd's binary and its store are under /var/atc, the data partition. The
# bootstrap renders atcd.service in /etc; this drop-in from the image adds the
# mount to it. Until /var/atc is mounted, atcd does not start, so it never runs
# against the empty mount point on the rootfs. On the nvbootctrl backend the
# mount is nofail with a 30 s device timeout: a missing UDA fails the mount,
# and atcd then fails with it, visible in `systemctl --failed`.
[Unit]
RequiresMountsFor=/var/atc
