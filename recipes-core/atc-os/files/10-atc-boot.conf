# RAUC's GRUB backend reads and writes /boot/atc/grubenv on the ESP. The ESP
# mount is nofail, so a boot can continue without it. This drop-in holds
# rauc.service until /boot is mounted. When the mount fails, rauc.service
# fails with it, visible in `systemctl --failed`, and every call to RAUC fails
# with a reason. RAUC never runs against the empty mount point on the rootfs.
# GRUB backend only: the nvbootctrl backend has no /boot mount.
[Unit]
RequiresMountsFor=/boot
