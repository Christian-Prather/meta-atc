# The lab opt-in ATC_RAUC_CHILD_SLOTS only. system.conf names
# data-directory=/data/rauc on UDA, which is nofail. This drop-in holds
# rauc.service until /data is mounted. When the mount fails, rauc.service fails
# with it, visible in `systemctl --failed`. RAUC never writes its central
# status into the empty mount point on the rootfs, where the other slot cannot
# see it.
[Unit]
RequiresMountsFor=/data/rauc
