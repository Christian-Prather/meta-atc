# The lab opt-in ATC_RAUC_CHILD_SLOTS only. RAUC's data directory on UDA,
# outside the atcd store. systemd-tmpfiles-setup.service runs in
# sysinit.target, after /data is mounted and before rauc.service starts.
#
# root only, 0700: RAUC runs as root, and the central status names the slot
# that each install wrote. User atc reads the status over D-Bus, not here.
d /data/rauc 0700 root root -
