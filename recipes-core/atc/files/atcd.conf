# The atcd store root and the hook user's home, with the owner and mode that
# `atc bootstrap` gives them. /var/atc is the data partition, mounted before
# systemd-tmpfiles-setup.service runs, so this sets the partition's root
# directory, not a directory in the slot.
#
# 0750: atcd runs hooks as atc-hooks, a member of group atc, which needs to
# traverse the store.
d /var/atc 0750 atc atc -
d /var/lib/atc-hooks 0700 atc-hooks atc -
