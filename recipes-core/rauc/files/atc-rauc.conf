<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  The atc replacement for RAUC's stock D-Bus policy.

  The stock de.pengutronix.rauc.conf lets ANY local user install a bundle and
  mark a slot. rauc_%.bbappend deletes it and installs this file. Three rules:

    1. root may own the name;
    2. root and user atc, which runs atcd, may call it;
    3. the default context denies every send to it.

  The image creates `atc` with a fixed id (atc-ab-runtime.inc). A device whose
  atcd runs as another user gets AccessDenied, and the OS tier stays off there.
-->
<busconfig>
  <policy user="root">
    <allow own="de.pengutronix.rauc"/>
    <allow send_destination="de.pengutronix.rauc"/>
  </policy>

  <policy user="atc">
    <allow send_destination="de.pengutronix.rauc"/>
  </policy>

  <policy context="default">
    <deny send_destination="de.pengutronix.rauc"/>
  </policy>
</busconfig>
