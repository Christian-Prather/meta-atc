[system]
compatible=atc-qemux86-64
bootloader=grub
grubenv=/boot/atc/grubenv
bundle-formats=verity
data-directory=/var/lib/rauc

[handlers]
pre-install=/usr/libexec/atc-os/atc-os-pre-install

[keyring]
path=/etc/rauc/keyring.pem

[slot.rootfs.0]
device=/dev/disk/by-partlabel/atcroota
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/disk/by-partlabel/atcrootb
type=ext4
bootname=B
