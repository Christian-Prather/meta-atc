[system]
compatible=atc-@MACHINE@
bootloader=custom
bundle-formats=verity
data-directory=/var/lib/rauc

[handlers]
bootloader-custom-backend=/usr/lib/rauc/atc-nvbootctrl-backend
pre-install=/usr/libexec/atc-os/atc-os-pre-install

[keyring]
path=/etc/rauc/keyring.pem

[slot.rootfs.0]
device=/dev/disk/by-partlabel/APP
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/disk/by-partlabel/APP_b
type=ext4
bootname=B
