[system]
compatible=atc-@MACHINE@
bootloader=custom
bundle-formats=verity
data-directory=/data/rauc

[handlers]
bootloader-custom-backend=/usr/lib/rauc/atc-nvbootctrl-backend
pre-install=/usr/libexec/atc-os/atc-os-pre-install

[keyring]
path=/etc/rauc/keyring.pem

[slot.rootfs.0]
device=/dev/disk/by-partlabel/APP
type=ext4
bootname=A

[slot.kernel.0]
device=/dev/disk/by-partlabel/A_kernel
type=raw
parent=rootfs.0

[slot.dtb.0]
device=/dev/disk/by-partlabel/A_kernel-dtb
type=raw
parent=rootfs.0

[slot.rootfs.1]
device=/dev/disk/by-partlabel/APP_b
type=ext4
bootname=B

[slot.kernel.1]
device=/dev/disk/by-partlabel/B_kernel
type=raw
parent=rootfs.1

[slot.dtb.1]
device=/dev/disk/by-partlabel/B_kernel-dtb
type=raw
parent=rootfs.1
